version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: app_mysql
    restart: always
    command: --innodb-buffer-pool-size=64M --max-connections=30
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: ghcr.io/hinzahawa/full-stack-training/backend:latest
    container_name: app_backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: myapp_db
      PORT: "8080"
    depends_on:
      - db

  frontend:
    image: ghcr.io/hinzahawa/full-stack-training/frontend:latest 
    container_name: app_frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      NEXT_PUBLIC_API_URL: http://161.118.242.116/api
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: app_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  mysql_data: