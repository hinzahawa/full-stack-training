# 1. บล็อกสำหรับ HTTP (Port 80) - ทำการ Redirect Traffic ทั้งหมดไปที่ HTTPS
server {
    listen 80;
    server_name prasert-nacha.duckdns.org;

    return 301 https://$host$request_uri;
}

# 2. บล็อกสำหรับ HTTPS (Port 443) - ใช้ Config เดิมของคุณพร้อมเปิด SSL
server {
    listen 443 ssl;
    server_name prasert-nacha.duckdns.org;

    # พาธไฟล์ SSL Certificate จาก Certbot
    ssl_certificate /etc/letsencrypt/live/prasert-nacha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prasert-nacha.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ส่ง Traffic หน้าแรกไปที่ Next.js (Frontend)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ส่ง Traffic ที่ขึ้นต้นด้วย /api/ ไปที่ Go API (Backend)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}